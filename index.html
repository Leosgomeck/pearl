<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="PEARL: Professional Equine Advisory for Results & Learning. Personalized online advisory in equine reproduction.">
<title>PEARL Equine Advisory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* Layout: one long night-navy scroll, a pearl-ivory "daylight" band for reading sections, gold hairlines as the only ornament. */
:root{
  --ink:#060b18;          /* deepest navy, page ground */
  --navy:#0b1530;         /* section ground */
  --navy-2:#13213f;       /* raised surface */
  --line:rgba(201,164,106,.28);
  --gold:#c9a46a;
  --gold-hi:#ecd3a1;
  --pearl:#f4f0e8;        /* ivory band */
  --pearl-2:#e9e2d4;
  --text:#e9e6df;
  --mist:#9aa5bd;
  --ink-text:#16203a;     /* text on ivory */
  --ink-mute:#5b6479;
  --ok:#7fc8a3;
  --err:#e48a7a;
  --f-display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --step--1:clamp(.78rem,.75rem + .15vw,.86rem);
  --step-0:clamp(.95rem,.9rem + .25vw,1.06rem);
  --step-1:clamp(1.2rem,1.1rem + .5vw,1.45rem);
  --step-2:clamp(1.6rem,1.35rem + 1.2vw,2.4rem);
  --step-3:clamp(2.2rem,1.7rem + 2.4vw,3.8rem);
  --step-hero:clamp(4rem,2.6rem + 9vw,10.5rem);
  --wrap:1180px;
  --ease:cubic-bezier(.22,.8,.24,1);
  color-scheme:dark;
}
html[lang="ar"]{
  --f-display:"Amiri","Cormorant Garamond",Georgia,serif;
  --f-body:"IBM Plex Sans Arabic","Manrope","Segoe UI",Tahoma,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:var(--step-0);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:opacity .35s ease}
body.switching{opacity:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{display:inline-flex;align-items:center;gap:.8em;font-size:var(--step--1);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:.95rem}
.eyebrow::before{content:"";width:34px;height:1px;background:currentColor}
.sec{position:relative;padding-block:clamp(72px,10vw,140px)}
.sec-head{display:grid;gap:18px;max-width:760px;margin-bottom:clamp(36px,5vw,64px)}
.sec-head h2{font-size:var(--step-3)}
.sec-head h2 em{font-style:italic;color:var(--gold-hi)}
html[lang="ar"] .sec-head h2 em{font-style:normal}
.sec-head p{color:var(--mist);max-width:62ch}
.light{background:var(--pearl);color:var(--ink-text)}
.light .sec-head p{color:var(--ink-mute)}
.light .eyebrow{color:#9a7637}
.light .sec-head h2 em{color:#9a7637}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border:1px dashed currentColor;border-radius:99px;color:var(--gold);opacity:.85;width:max-content}
.light .sample{color:#9a7637}

/* progress + nav */
.progress{position:fixed;top:env(safe-area-inset-top,0px);inset-inline-start:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--gold),var(--gold-hi));z-index:70}
html[dir="rtl"] .progress{transform-origin:100% 50%}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;transition:background .4s,box-shadow .4s,backdrop-filter .4s}
.nav.scrolled{background:rgba(6,11,24,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.nav-in{display:flex;align-items:center;gap:20px;height:76px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
.brand-mark{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9d4cc 45%,#8f8a86 100%);box-shadow:0 0 0 1px var(--gold),0 0 0 5px var(--ink),0 0 0 6px var(--line),0 0 24px rgba(236,211,161,.35)}
.brand-word{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.65rem;letter-spacing:.28em;font-weight:500}
.menu{display:flex;gap:clamp(10px,1.6vw,26px);margin-inline-start:auto;list-style:none;padding:0;margin-block:0}
.menu a{text-decoration:none;font-size:.86rem;letter-spacing:.04em;color:var(--mist);position:relative;padding-block:6px;transition:color .3s;white-space:nowrap}
.menu a::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .4s var(--ease)}
.menu a:hover,.menu a.active{color:var(--text)}
.menu a.active::after,.menu a:hover::after{transform:scaleX(1)}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px;flex-shrink:0}
.lang button{background:none;border:0;cursor:pointer;padding:5px 11px;border-radius:99px;font-size:.76rem;letter-spacing:.08em;color:var(--mist);transition:background .3s,color .3s}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--ink);font-weight:700}
.burger{display:none;background:none;border:1px solid var(--line);width:44px;height:44px;border-radius:50%;cursor:pointer;position:relative}
.burger span{position:absolute;inset-inline:13px;height:1px;background:var(--text);transition:transform .35s var(--ease),opacity .3s}
.burger span:nth-child(1){top:17px}.burger span:nth-child(2){top:22px}.burger span:nth-child(3){top:27px}
.nav.open .burger span:nth-child(1){transform:translateY(5px) rotate(45deg)}
.nav.open .burger span:nth-child(2){opacity:0}
.nav.open .burger span:nth-child(3){transform:translateY(-5px) rotate(-45deg)}

.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:99px;text-decoration:none;font-weight:600;font-size:.92rem;letter-spacing:.03em;cursor:pointer;border:1px solid transparent;transition:transform .35s var(--ease),background .35s,color .35s,box-shadow .35s;position:relative;overflow:hidden}
.btn-gold{background:linear-gradient(120deg,#b88f52,var(--gold-hi) 50%,#b88f52);background-size:200% 100%;color:#1a1408;box-shadow:0 10px 30px -10px rgba(201,164,106,.6)}
.btn-gold:hover{background-position:100% 0;transform:translateY(-2px)}
.btn-ghost{border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--gold);background:rgba(201,164,106,.08)}
.btn .arr{transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}
html[dir="rtl"] .btn .arr{transform:scaleX(-1)}
html[dir="rtl"] .btn:hover .arr{transform:scaleX(-1) translateX(4px)}

/* HERO */
.hero{position:relative;margin-top:-76px;padding-top:calc(76px + clamp(40px,7vw,90px));padding-bottom:clamp(50px,7vw,90px);overflow:hidden;background:radial-gradient(1200px 700px at 72% 40%,#16264a 0%,var(--ink) 65%)}
#sky{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero-grid{position:relative;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:30px}
.hero-copy{display:grid;gap:26px;min-width:0}
.hero-logo{width:118px;height:118px;border-radius:50%;overflow:hidden;mix-blend-mode:lighten;-webkit-mask:radial-gradient(circle,#000 58%,transparent 71%);mask:radial-gradient(circle,#000 58%,transparent 71%);animation:fadeUp 1.1s var(--ease) both}
.hero-logo img{width:100%;height:100%;object-fit:cover;display:block}
.hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:var(--step-hero);letter-spacing:.14em;font-weight:500;line-height:.9;display:flex;background:linear-gradient(180deg,#fff 30%,#cfc7b8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr;justify-self:start}
html[dir="rtl"] .hero h1{justify-self:start}
.hero h1 span{display:inline-block;animation:letter 1.3s var(--ease) both}
.hero h1 span:nth-child(2){animation-delay:.08s}.hero h1 span:nth-child(3){animation-delay:.16s}.hero h1 span:nth-child(4){animation-delay:.24s}.hero h1 span:nth-child(5){animation-delay:.32s}
@keyframes letter{from{opacity:0;transform:translateY(.35em);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero-tag{display:flex;align-items:center;gap:16px;font-family:var(--f-display);font-size:var(--step-1);color:var(--text);animation:fadeUp 1s .4s var(--ease) both}
.hero-tag::before,.hero-tag::after{content:"";height:1px;width:42px;background:var(--gold);flex-shrink:0}
.motto{font-family:var(--f-display);font-size:var(--step-2);line-height:1.15;animation:fadeUp 1s .55s var(--ease) both}
.motto b{font-weight:500;color:var(--gold-hi)}
.hero-lead{color:var(--mist);max-width:52ch;animation:fadeUp 1s .7s var(--ease) both}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px;animation:fadeUp 1s .85s var(--ease) both}
.hero-art{position:relative;aspect-ratio:1;max-width:100%;animation:fadeUp 1.4s .3s var(--ease) both}
.orbit{position:absolute;inset:2%;border-radius:50%;border:1px solid var(--line)}
.orbit.o2{inset:-6%;border-style:dashed;opacity:.5;animation:spin 80s linear infinite}
.orbit.o1{animation:spin 50s linear infinite reverse}
.orbit::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 14px var(--gold-hi)}
@keyframes spin{to{transform:rotate(360deg)}}
.shell{position:absolute;inset:9%;border-radius:50%;overflow:hidden;-webkit-mask:radial-gradient(circle,#000 55%,transparent 70%);mask:radial-gradient(circle,#000 55%,transparent 70%);animation:float 7s ease-in-out infinite}
.shell img{width:100%;height:100%;object-fit:cover;transform:scale(1.15);display:block}
.shine{position:absolute;inset:9%;border-radius:50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);background-size:250% 100%;mix-blend-mode:screen;animation:shine 6s ease-in-out infinite;pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes shine{0%,60%{background-position:150% 0}100%{background-position:-50% 0}}
.pillars{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin-top:clamp(40px,6vw,70px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pillar{display:flex;align-items:center;gap:14px;padding:22px 18px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
html[lang="ar"] .pillar{letter-spacing:0;font-size:.95rem}
.pillar+.pillar{border-inline-start:1px solid var(--line)}
.pillar svg{width:30px;height:30px;flex-shrink:0;stroke:var(--gold);fill:none;stroke-width:1.3}

/* marquee */
.marquee{overflow:hidden;background:var(--gold);color:#1b150a;padding-block:14px;direction:ltr}
.marquee-track{display:flex;gap:44px;width:max-content;animation:marq 48s linear infinite;font-family:var(--f-display);font-size:1.35rem;font-style:italic;white-space:nowrap}
html[lang="ar"] .marquee-track{font-style:normal;animation-direction:reverse}
.marquee-track span{display:inline-flex;align-items:center;gap:44px}
.marquee-track span::after{content:"";width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9d4cc 50%,#8f8a86)}
@keyframes marq{to{transform:translateX(-50%)}}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(30px,6vw,90px);align-items:start}
.about-text{display:grid;gap:22px;min-width:0}
.about-text p{color:var(--ink-mute);font-size:1.05rem;max-width:60ch}
.about-text .big{font-family:var(--f-display);font-size:var(--step-2);color:var(--ink-text);line-height:1.2}
.principles{display:grid;gap:0;margin-top:10px;border-top:1px solid #d9cfbb}
.principle{display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:center;padding-block:18px;border-bottom:1px solid #d9cfbb}
.principle svg{width:36px;height:36px;stroke:#9a7637;fill:none;stroke-width:1.3}
.principle strong{font-family:var(--f-display);font-size:1.35rem;font-weight:600}
.mv{display:grid;gap:18px}
.mv-card{background:var(--navy);color:var(--text);border-radius:22px;padding:30px;position:relative;overflow:hidden}
.mv-card h3{font-size:1.6rem;color:var(--gold-hi);margin-bottom:10px}
.mv-card p{color:#c3c9d6;font-size:.97rem}

.mv-card.horses ul{margin:12px 0 0;padding-inline-start:18px;color:#d7dce6;font-size:.95rem;display:grid;gap:4px}
.mv-card.horses li::marker{color:var(--gold)}
.quote,.mv-card .quote{font-family:var(--f-display);font-size:1.65rem;line-height:1.2;color:#fff}

/* STATS */
.stats{background:var(--navy);border-block:1px solid var(--line)}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr)}
.stat{padding:34px 18px;text-align:center;display:grid;gap:6px;justify-items:center}
.stat+.stat{border-inline-start:1px solid var(--line)}
.stat .n{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(2.4rem,1.8rem + 2vw,3.6rem);color:var(--gold-hi);line-height:1;font-variant-numeric:tabular-nums}
.stat .n.word{font-size:clamp(1.5rem,1.2rem + 1vw,2.1rem);padding-block:.45em}
html[lang="ar"] .stat .n.word{font-family:"Amiri",serif}
.stat .l{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
html[lang="ar"] .stat .l{letter-spacing:0;font-size:.92rem}

/* LECTURES */
.lectures{background:var(--ink)}
.lec-list{display:grid;border-top:1px solid var(--line)}
.lec{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:24px;align-items:center;padding:30px 6px;border-bottom:1px solid var(--line);position:relative;transition:background .5s,padding .5s var(--ease)}
.lec::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(201,164,106,.10),transparent 70%);opacity:0;transition:opacity .5s;pointer-events:none}
html[dir="rtl"] .lec::before{background:linear-gradient(270deg,rgba(201,164,106,.10),transparent 70%)}
.lec:hover::before{opacity:1}
.lec:hover{padding-inline-start:22px}
.lec h3{font-size:var(--step-2);font-weight:500}
.lec .meta{display:grid;gap:4px;color:var(--mist);font-size:.92rem}
.lec .meta b{color:var(--text);font-weight:600}
.lec .go{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .4s,border-color .4s,transform .4s var(--ease);background:none;cursor:pointer;color:var(--gold-hi)}
.lec:hover .go{background:var(--gold);border-color:var(--gold);color:var(--ink);transform:rotate(-45deg)}
html[dir="rtl"] .lec .go svg{transform:scaleX(-1)}
html[dir="rtl"] .lec:hover .go{transform:rotate(45deg)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{font-size:.74rem;padding:4px 11px;border-radius:99px;border:1px solid var(--line);color:var(--gold-hi);letter-spacing:.04em}
.lec-foot{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-top:34px}

/* CLASSES */
.classes{background:linear-gradient(180deg,var(--navy),var(--ink))}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s;margin-bottom:clamp(50px,6vw,80px)}
.step{position:relative;padding:28px 24px 26px;border-radius:20px;background:var(--navy-2);border:1px solid rgba(255,255,255,.05);display:grid;gap:10px;align-content:start;min-width:0;transition:transform .5s var(--ease),border-color .5s}
.step:hover{transform:translateY(-6px);border-color:var(--line)}
.step .num{font-family:"Cormorant Garamond",serif;font-size:3rem;line-height:1;color:transparent;-webkit-text-stroke:1px var(--gold)}
.step h3{font-size:1.45rem}
.step p{color:var(--mist);font-size:.93rem}
.topics{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,5vw,70px);align-items:start}
.tablist{display:grid;gap:6px}
.tablist button{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 4px;cursor:pointer;font-family:var(--f-display);font-size:var(--step-1);color:var(--mist);transition:color .3s,padding .4s var(--ease)}
.tablist button[aria-selected="true"]{color:var(--text);padding-inline-start:16px}
.tablist button .dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--gold);transition:background .3s,box-shadow .3s;flex-shrink:0}
.tablist button[aria-selected="true"] .dot{background:var(--gold-hi);box-shadow:0 0 12px var(--gold-hi)}
.tabpanel{background:var(--navy-2);border:1px solid var(--line);border-radius:24px;padding:clamp(24px,4vw,40px);min-height:320px;position:relative;overflow:hidden}
.tabpanel h3{font-size:var(--step-2);margin-bottom:8px}
.tabpanel>p{color:var(--mist);margin-bottom:22px}
.tabpanel ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
.tabpanel li{display:flex;gap:10px;align-items:baseline;animation:fadeUp .55s var(--ease) both}
.tabpanel li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;transform:translateY(-2px)}
.formats{margin-top:clamp(50px,6vw,80px);display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.fmt{border-radius:22px;padding:30px;border:1px solid var(--line);display:grid;gap:12px;align-content:start;position:relative;overflow:hidden;transition:transform .5s var(--ease)}
.fmt:hover{transform:translateY(-6px)}
.fmt.feat{background:linear-gradient(160deg,rgba(201,164,106,.18),rgba(201,164,106,.02));border-color:var(--gold)}
.fmt .dur{font-family:"Cormorant Garamond",serif;font-size:3.4rem;line-height:1;color:var(--gold-hi)}
.fmt .dur small{font-size:1.1rem;color:var(--mist);margin-inline-start:6px}
.fmt h3{font-size:1.5rem}
.fmt p{color:var(--mist);font-size:.93rem}
.fmt .price{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.who{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.who span{padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:.86rem;color:#cdd3df}

/* AGENDA */
.agenda{background:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px;align-items:center}
.filters button{background:none;border:1px solid var(--line);color:var(--mist);padding:9px 18px;border-radius:99px;cursor:pointer;font-size:.86rem;transition:all .3s}
.filters button[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.filters .sample{margin-inline-start:auto}
.events{display:grid;gap:14px}
.event{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:26px;align-items:center;padding:22px 26px;border-radius:20px;background:var(--navy);border:1px solid rgba(255,255,255,.05);transition:transform .45s var(--ease),border-color .45s,opacity .4s}
.event:hover{transform:translateX(8px);border-color:var(--line)}
html[dir="rtl"] .event:hover{transform:translateX(-8px)}
.event.hide{display:none}
.date{display:grid;justify-items:center;line-height:1;padding-inline-end:22px;border-inline-end:1px solid var(--line)}
.date .d{font-family:"Cormorant Garamond",serif;font-size:2.8rem;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.date .m{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mist);margin-top:6px}
html[lang="ar"] .date .m{letter-spacing:0;font-size:.85rem}
.event h3{font-size:1.5rem}
.event .where{color:var(--mist);font-size:.92rem;display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px}
.badge{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--gold-hi);white-space:nowrap}
html[lang="ar"] .badge{letter-spacing:0;font-size:.82rem}
.badge.online{border-color:rgba(127,200,163,.45);color:var(--ok)}

/* TEAM */
.team{background:linear-gradient(180deg,var(--ink),var(--navy));overflow:hidden}
.team-bg{position:absolute;inset-inline-end:-4%;top:6%;width:min(420px,42vw);opacity:.35;-webkit-mask:linear-gradient(90deg,transparent,#000 45%);mask:linear-gradient(90deg,transparent,#000 45%);pointer-events:none}
html[dir="rtl"] .team-bg{transform:scaleX(-1)}
.team-bg img{width:100%;display:block}
.team-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.member{border-radius:26px;padding:30px;background:rgba(19,33,63,.75);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(6px);display:grid;gap:16px;align-content:start;transition:transform .6s var(--ease),border-color .5s,box-shadow .5s;transform-style:preserve-3d;min-width:0}
.member:hover{border-color:var(--line);box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.portrait{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 30% 25%,#22345e,#0b1530);box-shadow:0 0 0 1px var(--gold),0 0 0 7px rgba(6,11,24,.9),0 0 0 8px var(--line)}
.portrait span{font-family:"Cormorant Garamond",serif;font-size:2.4rem;color:var(--gold-hi);letter-spacing:.04em}
.portrait small{position:absolute;bottom:-10px;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);padding:2px 8px;border-radius:99px;color:var(--mist);border:1px solid var(--line);white-space:nowrap}
.member h3{font-size:1.75rem}
.member .cred{color:var(--gold);font-weight:600;font-size:.86rem;letter-spacing:.1em}
.member p{color:#c3c9d6;font-size:.94rem}
.member .yrs{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:14px;color:var(--mist);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
html[lang="ar"] .member .yrs{letter-spacing:0}
.member .yrs b{font-family:"Cormorant Garamond",serif;font-size:2rem;color:var(--gold-hi);font-weight:500;letter-spacing:0}
.board-note{margin-top:28px;display:flex;align-items:center;gap:14px;color:var(--mist);font-size:.95rem}
.board-note svg{width:28px;height:28px;stroke:var(--gold);fill:none;stroke-width:1.3;flex-shrink:0}

/* STUDIES */
.studies .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid #d9cfbb;border-inline-start:1px solid #d9cfbb}
.study{padding:30px 28px;border-bottom:1px solid #d9cfbb;border-inline-end:1px solid #d9cfbb;display:grid;gap:12px;align-content:start;position:relative;overflow:hidden;transition:background .5s}
.study:hover{background:#fbf8f2}
.study svg{width:40px;height:40px;stroke:#9a7637;fill:none;stroke-width:1.2}
.study h3{font-size:1.5rem;color:var(--ink-text)}
.study p{color:var(--ink-mute);font-size:.94rem}
.study .lead{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#9a7637;font-weight:600}
html[lang="ar"] .study .lead{letter-spacing:0;font-size:.88rem}
.sci{margin-top:clamp(40px,5vw,60px);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:30px;align-items:center;background:var(--navy);color:var(--text);border-radius:28px;padding:clamp(26px,4vw,48px)}
.sci h3{font-size:var(--step-2)}
.sci p{color:var(--mist);margin-top:10px}
.sci ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sci li{padding:14px 16px;border:1px solid var(--line);border-radius:14px;font-size:.92rem;display:flex;gap:10px;align-items:center}
.sci li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold-hi);flex-shrink:0}

/* ARTICLES */
.articles{background:var(--pearl-2)}
.art-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:20px}
.art{border-radius:24px;overflow:hidden;background:#fff;color:var(--ink-text);display:grid;grid-template-rows:auto 1fr;transition:transform .5s var(--ease),box-shadow .5s;box-shadow:0 1px 0 #d9cfbb;min-width:0}
.art:hover{transform:translateY(-8px);box-shadow:0 30px 50px -30px rgba(22,32,58,.45)}
.art .cover{aspect-ratio:16/10;position:relative;overflow:hidden;background:var(--navy)}
.art .cover canvas{width:100%;height:100%;display:block;transition:transform 1s var(--ease)}
.art:hover .cover canvas{transform:scale(1.06)}
.art .cover .cat{position:absolute;top:16px;inset-inline-start:16px;background:rgba(6,11,24,.7);color:var(--gold-hi);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:99px;backdrop-filter:blur(6px)}
html[lang="ar"] .art .cover .cat{letter-spacing:0;font-size:.82rem}
.art .body{padding:24px 26px 28px;display:grid;gap:10px;align-content:start}
.art h3{font-size:1.5rem;line-height:1.15}
.art p{color:var(--ink-mute);font-size:.93rem}
.art .foot{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-mute);margin-top:6px;padding-top:12px;border-top:1px solid #ece4d4}
.art.big h3{font-size:1.9rem}

/* CONTACT */
.contact{background:radial-gradient(900px 600px at 15% 20%,#16264a,var(--ink) 70%);overflow:hidden}
.contact-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(30px,6vw,80px);align-items:start}
.contact-side{display:grid;gap:24px}
.contact-side .quote{font-size:clamp(1.6rem,1.3rem + 1.2vw,2.3rem)}
.contact-side ul{list-style:none;padding:0;margin:0;display:grid;gap:14px;color:var(--mist)}
.contact-side li{display:flex;gap:12px;align-items:flex-start}
.contact-side li svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.4;flex-shrink:0;margin-top:3px}
form{background:rgba(19,33,63,.7);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,4vw,40px);display:grid;grid-template-columns:1fr 1fr;gap:18px;backdrop-filter:blur(10px)}
.field{display:grid;gap:7px;min-width:0}
.field.full{grid-column:1/-1}
label,.lbl{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-hi);font-weight:600}
html[lang="ar"] label,html[lang="ar"] .lbl{letter-spacing:0;font-size:.9rem}
input,select,textarea{width:100%;background:rgba(6,11,24,.55);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 14px;font-size:.98rem;color:var(--text);transition:border-color .3s,box-shadow .3s;min-width:0}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
html[dir="rtl"] select{background-position:18px 55%,13px 55%}
option{background:var(--navy);color:var(--text)}
input::placeholder,textarea::placeholder{color:#6b768f}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,164,106,.15)}
.phone{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.6fr) minmax(0,1.3fr);gap:10px}
.phone .sub{display:grid;gap:5px;min-width:0}
.phone .sub span{font-size:.7rem;color:var(--mist);letter-spacing:.06em}
input[type="tel"],input.num{direction:ltr;text-align:start}
html[dir="rtl"] input[type="tel"],html[dir="rtl"] input.num{text-align:right}
.field .err{font-size:.8rem;color:var(--err);min-height:0}
.field.bad input,.field.bad select{border-color:var(--err)}
.form-foot{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-top:6px}
.form-foot small{color:var(--mist);max-width:44ch;font-size:.8rem}
.done{grid-column:1/-1;display:grid;gap:12px;justify-items:start;padding-block:30px}
.done .check{width:64px;height:64px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold-hi)}
.done h3{font-size:var(--step-2)}
.done p{color:var(--mist)}

/* FOOTER */
footer{background:#040812;border-top:1px solid var(--line);padding-block:50px 40px}
.foot-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}
.foot-grid p{color:var(--mist);font-size:.92rem;max-width:56ch}
.foot-grid p b{color:var(--gold);font-weight:600}
.foot-links{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:flex-end;list-style:none;padding:0;margin:0}
.foot-links a{color:var(--mist);text-decoration:none;font-size:.88rem}
.foot-links a:hover{color:var(--gold-hi)}
.copy{margin-top:34px;padding-top:22px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;color:#5e6882;font-size:.8rem}

/* reveal: only applied to elements that start below the fold */
.pending{opacity:0;transform:translateY(34px)}
.revealed{opacity:1;transform:none;transition:opacity 1s var(--ease),transform 1s var(--ease)}

/* RESPONSIVE */
@media (max-width:1080px){
  .menu{position:fixed;inset:76px 0 auto 0;top:calc(76px + env(safe-area-inset-top,0px));flex-direction:column;gap:0;background:rgba(6,11,24,.97);backdrop-filter:blur(14px);padding:10px max(20px,env(safe-area-inset-left,0px)) 24px max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);transform:translateY(-12px);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s var(--ease)}
  .nav.open .menu{opacity:1;transform:none;pointer-events:auto}
  .menu a{display:block;padding:14px 4px;font-size:1.05rem;border-bottom:1px solid rgba(255,255,255,.06)}
  .menu a::after{display:none}
  .burger{display:block}
  .nav-in{gap:12px}
  .lang{margin-inline-start:auto}
  .stats-grid{grid-template-columns:repeat(3,1fr)}
  .stat:nth-child(4){border-inline-start:0}
  .stat:nth-child(n+4){border-top:1px solid var(--line)}
  .steps{grid-template-columns:repeat(2,1fr)}
  .team-grid{grid-template-columns:1fr 1fr}
  .art-grid{grid-template-columns:1fr 1fr}
  .art.big{grid-column:1/-1}
}
@media (max-width:820px){
  .hero-grid,.about-grid,.topics,.contact-grid,.sci,.foot-grid{grid-template-columns:1fr}
  .hero-art{max-width:420px;justify-self:center;width:100%;order:-1;margin-bottom:-20px}
  .hero-logo{display:none}
  .pillars{grid-template-columns:1fr 1fr}
  .pillar:nth-child(3){border-inline-start:0}
  .pillar:nth-child(n+3){border-top:1px solid var(--line)}
  .lec{grid-template-columns:1fr;gap:12px}
  .lec .go{justify-self:start}
  .formats{grid-template-columns:1fr}
  .studies .grid{grid-template-columns:1fr 1fr}
  .foot-links{justify-content:flex-start}
}
@media (max-width:600px){
  .brand-word{font-size:1.3rem;letter-spacing:.2em}
  .brand-mark{width:30px;height:30px}
  .lang button{padding:5px 8px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .stat:nth-child(n){border-inline-start:0;border-top:1px solid var(--line)}
  .stat:nth-child(even){border-inline-start:1px solid var(--line)}
  .stat:nth-child(-n+2){border-top:0}
  .stat:last-child{grid-column:1/-1}
  .steps,.team-grid,.art-grid,.studies .grid{grid-template-columns:1fr}
  .tabpanel ul,.sci ul{grid-template-columns:1fr}
  .event{grid-template-columns:1fr;gap:12px;padding:20px}
  .date{justify-items:start;grid-auto-flow:column;align-items:baseline;gap:10px;border:0;padding:0}
  .event .badge{justify-self:start}
  form{grid-template-columns:1fr}
  .phone{grid-template-columns:1fr 1fr}
  .phone .sub:first-child{grid-column:1/-1}
  .pillars{grid-template-columns:1fr}
  .pillar+.pillar{border-inline-start:0;border-top:1px solid var(--line)}
  .filters .sample{margin-inline-start:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
  .pending{opacity:1;transform:none}
}
</style>
</head>
<body>


<div class="progress" id="progress"></div>

<header class="nav" id="nav">
  <div class="wrap nav-in">
    <a class="brand" href="#top" aria-label="PEARL"><span class="brand-mark"></span><span class="brand-word">PEARL</span></a>
    <ul class="menu" id="menu">
      <li><a href="#about" data-i18n="nav.about"></a></li>
      <li><a href="#lectures" data-i18n="nav.lectures"></a></li>
      <li><a href="#classes" data-i18n="nav.classes"></a></li>
      <li><a href="#agenda" data-i18n="nav.agenda"></a></li>
      <li><a href="#team" data-i18n="nav.team"></a></li>
      <li><a href="#studies" data-i18n="nav.studies"></a></li>
      <li><a href="#articles" data-i18n="nav.articles"></a></li>
      <li><a href="#contact" data-i18n="nav.contact"></a></li>
    </ul>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ar" aria-pressed="false">ع</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
    <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>

<main id="top">
<section class="hero">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="wrap">

 '<svg viewBox="0 0 40 40"><ellipse cx="12" cy="12" rx="4" ry="3"/><path d="M15 14c6 4 4 10 10 12s8 6 10 10"/><ellipse cx="22" cy="8" rx="3" ry="2.4"/><path d="M24 10c4 3 4 6 9 7"/></svg>',
 '<svg viewBox="0 0 40 40"><path d="M8 10c4 0 6 4 6 8v8a6 6 0 0 0 12 0v-8c0-4 2-8 6-8"/><path d="M8 10c-2 0-3 2-2 4M32 10c2 0 3 2 2 4"/><circle cx="20" cy="26" r="2"/></svg>',
 '<svg viewBox="0 0 40 40"><path d="M15 4h10M16 4v12L7 32a2 2 0 0 0 2 3h22a2 2 0 0 0 2-3l-9-16V4"/><path d="M11 26h18"/><circle cx="18" cy="30" r="1"/><circle cx="23" cy="29" r="1.4"/></svg>'
];

let lang="en", tabIdx=0, filter="all", interestPref="";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const T=I18N[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir = lang==="ar"?"rtl":"ltr";
  $$("[data-i18n]").forEach(el=>{const v=T[el.dataset.i18n]; if(v!=null) el.textContent=v;});
  $$("[data-i18n-html]").forEach(el=>{const v=T[el.dataset.i18nHtml]; if(v!=null) el.innerHTML=v;});
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));

  const mq=T.marquee.map(m=>`<span>${esc(m)}</span>`).join("");
  $("#marquee").innerHTML=mq+mq;

  $("#lecList").innerHTML=T.lecs.map(l=>`<article class="lec">
    <div><h3>${esc(l.t)}</h3><div class="tags">${l.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div>
    <div class="meta"><b>${esc(l.by)}</b><span>${esc(T["lec.fmt"])}</span></div>
    <a class="go" href="#contact" data-interest="lecture" aria-label="${esc(T["lec.invite"])}">${ARROW}</a></article>`).join("");

  $("#steps").innerHTML=T.steps.map((s,i)=>`<div class="step"><span class="num">0${i+1}</span><h3>${esc(s.h)}</h3><p>${esc(s.p)}</p></div>`).join("");

  $("#tablist").innerHTML=T.topics.map((t,i)=>`<button type="button" role="tab" id="tab${i}" aria-selected="${i===tabIdx}" aria-controls="tabpanel"><span>${esc(t.t)}</span><span class="dot"></span></button>`).join("");
  $$("#tablist button").forEach((b,i)=>b.addEventListener("click",()=>{tabIdx=i;paintTab();}));
  paintTab();

  $("#formats").innerHTML=T.formats.map(f=>`<div class="fmt${f.f?" feat":""}">
    ${f.f?`<span class="sample" style="border-style:solid">${esc(T.popular)}</span>`:""}
    <span class="dur">${f.d}<small>${esc(T.min)}</small></span><h3>${esc(f.h)}</h3><p>${esc(f.p)}</p><span class="price">${esc(T.price)}</span></div>`).join("");
  $("#who").innerHTML=T.who.map(w=>`<span>${esc(w)}</span>`).join("");

  $("#events").innerHTML=T.events.map(e=>`<article class="event" data-k="${e.k}">
    <div class="date"><span class="d">${esc(e.d)}</span><span class="m">${esc(e.m)}</span></div>
    <div><h3>${esc(e.t)}</h3><div class="where"><span>${esc(e.w)}</span><span>· ${esc(e.by)}</span></div></div>
    <span class="badge${e.k==="online"?" online":""}">${esc(T["ag.badge."+e.k])}</span></article>`).join("");
  applyFilter();

  $("#teamGrid").innerHTML=T.team.map(m=>`<article class="member">
    <div class="portrait"><span>${m.i}</span><small>${esc(T.photo)}</small></div>
    <div><h3>${esc(m.n)}</h3><div class="cred">${esc(m.c)}</div></div>
    <p>${esc(m.p)}</p>
    <div class="tags">${m.t.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    <div class="yrs"><b>${m.y}</b>${esc(T.yrs)}</div></article>`).join("");
  $$(".member").forEach(tilt);

  $("#studyGrid").innerHTML=T.studies.map((s,i)=>`<div class="study">${STUDY_ICONS[i]}<h3>${esc(s.h)}</h3><p>${esc(s.p)}</p><span class="lead">${esc(s.l)}</span></div>`).join("");
  $("#sciList").innerHTML=T.sci.map(s=>`<li>${esc(s)}</li>`).join("");

  $("#artGrid").innerHTML=T.arts.map((a,i)=>`<article class="art${i===0?" big":""}">
    <div class="cover"><canvas data-seed="${i}"></canvas><span class="cat">${esc(a.c)}</span></div>
    <div class="body"><h3>${esc(a.t)}</h3><p>${esc(a.p)}</p><div class="foot"><span>${a.r} ${esc(T.read)}</span><span>${esc(T.soon)}</span></div></div></article>`).join("");
  $$(".art canvas").forEach(drawCover);

  $("#footLinks").innerHTML=["about","lectures","classes","agenda","team","studies","articles","contact"].map(k=>`<li><a href="#${k}">${esc(T["nav."+k])}</a></li>`).join("");

  buildSelects();
  bindInterestLinks();
  if($("#form .done")) showDone();
}

function paintTab(){
  const T=I18N[lang], t=T.topics[tabIdx];
  $$("#tablist button").forEach((b,i)=>b.setAttribute("aria-selected",i===tabIdx));
  $("#tabpanel").setAttribute("aria-labelledby","tab"+tabIdx);
  $("#tabpanel").innerHTML=`<h3>${esc(t.t)}</h3><p>${esc(t.p)}</p><ul>${t.i.map((x,i)=>`<li style="animation-delay:${i*45}ms">${esc(x)}</li>`).join("")}</ul>`;
}

function applyFilter(){
  $$(".filters button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===filter));
  $$(".event").forEach(e=>e.classList.toggle("hide",filter!=="all"&&e.dataset.k!==filter));
}
$$(".filters button").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.f;applyFilter();}));

function buildSelects(){
  const T=I18N[lang];
  let names; try{names=new Intl.DisplayNames([lang],{type:"region"});}catch(e){names={of:c=>c};}
  const coll=new Intl.Collator(lang);
  const codes=Object.keys(DIAL).sort((a,b)=>coll.compare(names.of(a)||a,names.of(b)||b));
  const keep=id=>$(id).value;
  const d=keep("#f-dial"), c=keep("#f-country"), it=keep("#f-interest")||interestPref;
  $("#f-dial").innerHTML=`<option value="">${esc(T["f.choose"])}</option>`+codes.map(k=>`<option value="${k}">${esc(names.of(k)||k)} (+${DIAL[k]})</option>`).join("");
  $("#f-country").innerHTML=`<option value="">${esc(T["f.choose"])}</option>`+codes.map(k=>`<option value="${k}">${esc(names.of(k)||k)}</option>`).join("")+`<option value="OTHER">${lang==="ar"?"أخرى":lang==="es"?"Otro":"Other"}</option>`;
  $("#f-interest").innerHTML=`<option value="">${esc(T["f.choose"])}</option>`+INTEREST_KEYS.map(k=>`<option value="${k}">${esc(T.interests[k])}</option>`).join("");
  $("#f-dial").value=d; $("#f-country").value=c; $("#f-interest").value=it;
}
$("#f-country")?.addEventListener("change",e=>{ if(!$("#f-dial").value && DIAL[e.target.value]) $("#f-dial").value=e.target.value; });

function bindInterestLinks(){
  $$("[data-interest]").forEach(a=>a.onclick=()=>{interestPref=a.dataset.interest; const s=$("#f-interest"); if(s) s.value=interestPref;});
}

/* form */
function setErr(input,msg){const f=input.closest(".field");f.classList.toggle("bad",!!msg);f.querySelector(".err").textContent=msg||"";}
$("#form").addEventListener("submit",e=>{
  e.preventDefault();
  const T=I18N[lang]; let ok=true;
  ["#f-name","#f-city","#f-country","#f-interest"].forEach(id=>{const el=$(id);const bad=!el.value.trim();setErr(el,bad?T["f.req"]:"");if(bad)ok=false;});
  const em=$("#f-email"); const emBad=!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value.trim()); setErr(em,em.value.trim()?(emBad?T["f.bademail"]:""):T["f.req"]); if(emBad)ok=false;
  const ph=$("#f-phone"), dial=$("#f-dial"); const digits=($("#f-area").value+ph.value).replace(/\D/g,"");
  const phBad=!dial.value||digits.length<6||digits.length>14; setErr(ph,phBad?(dial.value&&ph.value?T["f.badphone"]:T["f.req"]):""); if(phBad)ok=false;
  if(!ok){ $("#form .bad input, #form .bad select")?.focus(); return; }
  showDone();
});
function showDone(){
  const T=I18N[lang]; const f=$("#form");
  f.innerHTML=`<div class="done"><div class="check"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12l5 5 9-10"/></svg></div><h3>${esc(T["f.ok"])}</h3><p>${esc(T["f.okp"])}</p><button type="button" class="btn btn-ghost" id="again">${esc(T["f.again"])}</button></div>`;
  $("#again").onclick=()=>location.reload();
}
$$("#form input, #form select").forEach(el=>el.addEventListener("input",()=>setErr(el,"")));
$("#f-area").addEventListener("input",e=>e.target.value=e.target.value.replace(/\D/g,""));
$("#f-phone").addEventListener("input",e=>e.target.value=e.target.value.replace(/[^\d\s-]/g,""));

/* language */
$$(".lang button").forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.lang===lang) return;
  document.body.classList.add("switching");
  setTimeout(()=>{lang=b.dataset.lang; try{localStorage.setItem("pearl-lang",lang);}catch(e){} render(); document.body.classList.remove("switching");},300);
}));

/* nav */
const nav=$("#nav"), burger=$("#burger");
burger.addEventListener("click",()=>{const o=nav.classList.toggle("open");burger.setAttribute("aria-expanded",o);});
$$("#menu a").forEach(a=>a.addEventListener("click",()=>{nav.classList.remove("open");burger.setAttribute("aria-expanded",false);}));
const prog=$("#progress");
function onScroll(){
  const y=scrollY, h=document.documentElement.scrollHeight-innerHeight;
  nav.classList.toggle("scrolled",y>30);
  prog.style.transform=`scaleX(${h>0?y/h:0})`;
}
addEventListener("scroll",onScroll,{passive:true}); onScroll();
const secIO=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ $$("#menu a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+en.target.id)); } }),{rootMargin:"-45% 0px -50% 0px"});
$$("main section[id]").forEach(s=>secIO.observe(s));

/* counters */
const cIO=new IntersectionObserver(es=>es.forEach(en=>{
  if(!en.isIntersecting) return; const el=en.target; cIO.unobserve(el);
  const to=+el.dataset.count, t0=performance.now(), dur=1600;
  const step=t=>{const p=Math.min(1,(t-t0)/dur), v=Math.round(to*(1-Math.pow(1-p,3))); el.textContent=v+"+"; if(p<1) requestAnimationFrame(step);};
  requestAnimationFrame(step);
}),{threshold:.6});
$$("[data-count]").forEach(el=>{el.textContent=el.dataset.count+"+"; cIO.observe(el);});

/* reveal below-the-fold blocks */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function setupReveal(){
  if(reduce) return;
  const io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("revealed"); en.target.classList.remove("pending"); io.unobserve(en.target);} }),{rootMargin:"0px 0px -8% 0px"});
  $$(".sec-head, .about-text, .mv-card, .lec-list, .steps, .topics, .formats, .events, .team-grid, .studies .grid, .sci, .art-grid, .contact-side, form, .stats-grid").forEach((el,i)=>{
    if(el.getBoundingClientRect().top>innerHeight*0.95){ el.classList.add("pending"); io.observe(el); }
  });
}

/* tilt */
function tilt(card){
  if(reduce || matchMedia("(hover: none)").matches) return;
  card.addEventListener("mousemove",e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`perspective(900px) rotateY(${x*7}deg) rotateX(${-y*7}deg) translateY(-4px)`;});
  card.addEventListener("mouseleave",()=>card.style.transform="");
}

/* hero parallax on pearl */
const art=$("#heroArt");
if(!reduce) addEventListener("mousemove",e=>{ const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5; art.style.translate=`${x*-18}px ${y*-14}px`; },{passive:true});

/* article covers: generated gold line studies */
function drawCover(cv){
  const seed=+cv.dataset.seed, dpr=Math.min(2,devicePixelRatio||1), w=cv.clientWidth||400, h=cv.clientHeight||250;
  cv.width=w*dpr; cv.height=h*dpr; const g=cv.getContext("2d"); g.scale(dpr,dpr);
  const bg=g.createRadialGradient(w*.7,h*.3,10,w*.5,h*.5,w); bg.addColorStop(0,"#1c2d55"); bg.addColorStop(1,"#070d1c");
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  g.lineWidth=1;
  if(seed===0){ // sperm-like motility tracks
    for(let k=0;k<26;k++){ let x=Math.random()*w,y=Math.random()*h,a=Math.random()*6.28; g.strokeStyle=`rgba(236,211,161,${.15+Math.random()*.4})`; g.beginPath(); g.moveTo(x,y); for(let s=0;s<40;s++){a+=Math.sin(s*.6+k)*.25; x+=Math.cos(a)*4; y+=Math.sin(a)*4; g.lineTo(x,y);} g.stroke(); g.fillStyle="rgba(244,240,232,.85)"; g.beginPath(); g.ellipse(x,y,2.6,1.8,a,0,6.28); g.fill(); }
  } else if(seed===1){ // follicle / embryo rings
    for(let k=0;k<7;k++){ const cx=w*(.2+Math.random()*.6),cy=h*(.2+Math.random()*.6),r=14+Math.random()*48; g.strokeStyle=`rgba(201,164,106,${.25+Math.random()*.4})`; g.beginPath(); g.arc(cx,cy,r,0,6.28); g.stroke(); g.beginPath(); g.arc(cx,cy,r*.82,0,6.28); g.stroke(); for(let c=0;c<6;c++){ g.fillStyle="rgba(244,240,232,.18)"; g.beginPath(); g.arc(cx+Math.cos(c)*r*.4,cy+Math.sin(c)*r*.4,r*.22,0,6.28); g.fill(); } }
  } else { // ultrasound fan
    const ox=w/2, oy=-h*.15; for(let a=-.55;a<=.55;a+=.012){ g.strokeStyle=`rgba(236,211,161,${.05+Math.random()*.12})`; g.beginPath(); g.moveTo(ox,oy); g.lineTo(ox+Math.sin(a)*h*1.3,oy+Math.cos(a)*h*1.3); g.stroke(); }
    g.fillStyle="rgba(6,11,24,.92)"; g.beginPath(); g.ellipse(w*.52,h*.58,w*.12,h*.16,.3,0,6.28); g.fill();
    g.strokeStyle="rgba(244,240,232,.7)"; g.stroke();
  }
}
addEventListener("resize",()=>$$(".art canvas").forEach(drawCover));

/* hero sky: drifting gold network (global reach) */
(function sky(){
  const cv=$("#sky"), g=cv.getContext("2d"); let w,h,pts=[],dpr=Math.min(2,devicePixelRatio||1);
  function size(){ w=cv.clientWidth; h=cv.clientHeight; cv.width=w*dpr; cv.height=h*dpr; g.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(90,w*h/14000)); pts=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:Math.random()*1.4+.3})); }
  function frame(){
    g.clearRect(0,0,w,h);
    for(const p of pts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1; }
    for(let i=0;i<pts.length;i++){ const a=pts[i]; g.fillStyle="rgba(236,211,161,.7)"; g.beginPath(); g.arc(a.x,a.y,a.r,0,6.28); g.fill();
      for(let j=i+1;j<pts.length;j++){ const b=pts[j], d=Math.hypot(a.x-b.x,a.y-b.y); if(d<130){ g.strokeStyle=`rgba(201,164,106,${(1-d/130)*.22})`; g.lineWidth=.6; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); } } }
    if(!reduce) requestAnimationFrame(frame);
  }
  size(); frame(); addEventListener("resize",size);
})();

try{ const s=localStorage.getItem("pearl-lang"); if(s&&I18N[s]) lang=s; }catch(e){}
render();
setupReveal();
</script>
